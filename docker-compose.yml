version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      # Ollama runs on host — GPU passthrough in Windows Docker is painful
      OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./chatbot.db:/app/chatbot.db

# Frontend: run via `npm run dev` outside Docker for fast HMR
# cd frontend && npm install && npm run dev
